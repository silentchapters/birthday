
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Promise and a Wish</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #241810;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 20px;
      overflow-x: hidden;
    }

    /* BOOK CONTAINER */

    #book {
      width: min(1100px, 100%);
      aspect-ratio: 3 / 2;
      margin: auto;
    }

    /* INDIVIDUAL PAGES */

    .page {
      position: relative;
      background-color: #f1e3cb;
      overflow: hidden;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* OPENING SUNSET SPREAD */

    .intro-left,
    .intro-right {
      background-image: url('./sunset-book.png');
      background-repeat: no-repeat;
      background-size: 200% 100%;
    }

    .intro-left {
      background-position: left center;
    }

    .intro-right {
      background-position: right center;
    }

    /* PAGE 2 - GOLDEN LAKE SPREAD */

    /* PAGE 2 LEFT - PARCHMENT */

    /* PAGE 2 RIGHT - SUNSET */

    /* PAGE 3 - PARCHMENT AND SUNSET */

    /* NAVIGATION */

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      background: #d6b58a;
      color: #29180f;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #edcfaa;
    }

    button:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
        gap: 18px;
      }

      button {
        padding: 10px 18px;
      }
    }
    /* PAGE 3 - COMBINED SPREAD */

.page3-left,
.page3-right {
  background-image: url('./page3-spread.png');
  background-repeat: no-repeat;
  background-size: 200% 100%;
}

.page3-left {
  background-position: left center;
}

.page3-right {
  background-position: right center;
}
    .page4-left,
.page4-right {
  background-image: url('./page4-spread.png');
  background-repeat: no-repeat;
  background-size: 200% 100%;
}

.page4-left {
  background-position: left center;
}

.page4-right {
  background-position: right center;
}
  </style>
</head>

<body>

  <main id="book">

    <!-- PAGE 1: INTRODUCTION -->
    <div class="page intro-left"></div>

    <!-- PAGE 2: INTRODUCTION -->
    <div class="page intro-right"></div>

    <!-- PAGE 3: PAGE 2 PARCHMENT -->
    <div class="page">
      <img src="./page2-left-parchment.png"
           alt="Page 2 parchment">
    </div>

    <!-- PAGE 4: PAGE 2 SUNSET -->
    <div class="page">
      <img src="./page2-right-sunset.png"
           alt="Page 2 sunset">
    </div>

    <!-- PAGE 5: PAGE 3 LEFT -->
<div class="page page3-left"></div>

<!-- PAGE 6: PAGE 3 RIGHT -->
<div class="page page3-right"></div>
    <!-- PAGE 7: PAGE 4 LEFT -->
<div class="page page4-left"></div>

<!-- PAGE 8: PAGE 4 RIGHT -->
<div class="page page4-right"></div>

  </main>

  <!-- NAVIGATION -->

  <div class="controls">

    <button id="backButton">Turn Back</button>

    <button id="nextButton">Turn Page</button>

  </div>

  <script>

    const bookElement = document.getElementById('book');

    const pageFlip = new St.PageFlip(bookElement, {

      width: 550,
      height: 733,

      size: 'stretch',

      minWidth: 150,
      maxWidth: 550,

      minHeight: 200,
      maxHeight: 733,

      maxShadowOpacity: 0.5,

      showCover: false,

      usePortrait: false,

      flippingTime: 1000,

      drawShadow: true,

      autoSize: true,

      mobileScrollSupport: false,

      startPage: 0

    });

    pageFlip.loadFromHTML(
      document.querySelectorAll('.page')
    );

    document.getElementById('nextButton')
      .addEventListener('click', () => {
        pageFlip.flipNext();
      });

    document.getElementById('backButton')
      .addEventListener('click', () => {
        pageFlip.flipPrev();
      });

  </script>

</body>
</html>
