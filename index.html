
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Promise and a Wish</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #241810;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 20px;
      overflow-x: hidden;
    }

    /* BOOK CONTAINER */

    #book {
      width: min(1100px, 100%);
      aspect-ratio: 3 / 2;
      margin: auto;
    }

    /* INDIVIDUAL PAGES */

    .page {
      background-color: #f1e3cb;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    /* OPENING SUNSET SPREAD */

    .intro-left {
      background-image: url('sunset-book.png');
      background-size: 200% 100%;
      background-position: left center;
    }

    .intro-right {
      background-image: url('sunset-book.png');
      background-size: 200% 100%;
      background-position: right center;
    }

    /* TEMPORARY TEST PAGES */

    .paper-page {
      background:
        linear-gradient(
          90deg,
          #e8d6b9,
          #f4e9d5 12%,
          #f4e9d5 88%,
          #e8d6b9
        );
      border: 1px solid rgba(100, 65, 35, 0.12);
    }

    /* NAVIGATION */

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      background: #d6b58a;
      color: #29180f;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #edcfaa;
    }

    button:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
        gap: 18px;
      }

      button {
        padding: 10px 18px;
      }
    }
  </style>
</head>

<body>

  <main id="book">

    <!-- PAGE 1: INTRODUCTION -->
    <div class="page intro-left"></div>

    <!-- PAGE 2: INTRODUCTION -->
    <div class="page intro-right"></div>

    <!-- PAGE 3: TEMPORARY TEST PAGE -->
    <div class="page paper-page"></div>

    <!-- PAGE 4: TEMPORARY TEST PAGE -->
    <div class="page paper-page"></div>

  </main>

  <div class="controls">

    <button id="backButton">
      Turn Back
    </button>

    <button id="nextButton">
      Turn Page
    </button>

  </div>

  <script>

    const bookElement = document.getElementById('book');

    const pageFlip = new St.PageFlip(bookElement, {

      width: 550,
      height: 733,

      size: 'stretch',

      minWidth: 150,
      maxWidth: 550,

      minHeight: 200,
      maxHeight: 733,

      maxShadowOpacity: 0.5,

      showCover: false,

      usePortrait: false,

      flippingTime: 1000,

      drawShadow: true,

      autoSize: true,

      mobileScrollSupport: false,

      startPage: 0

    });

    pageFlip.loadFromHTML(
      document.querySelectorAll('.page')
    );

    // PAGE NAVIGATION

    document.getElementById('nextButton')
      .addEventListener('click', () => {
        pageFlip.flipNext();
      });

    document.getElementById('backButton')
      .addEventListener('click', () => {
        pageFlip.flipPrev();
      });

  </script>

</body>
</html>
