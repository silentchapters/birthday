
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Promise and a Wish</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #241810;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .book-scene {
      width: min(1100px, 100%);
      aspect-ratio: 3 / 2;
      position: relative;
      perspective: 2000px;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      transform-style: preserve-3d;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
    }

    .page {
      width: 50%;
      height: 100%;
      position: relative;
      background-image: url('sunset-book.png');
      background-size: 200% 100%;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    .left-page {
      background-position: left center;
      border-radius: 5px 0 0 5px;
    }

    .right-page {
      background-position: right center;
      border-radius: 0 5px 5px 0;
    }

    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 3px;
      height: 100%;
      transform: translateX(-50%);
      background: rgba(50, 25, 12, 0.35);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
      z-index: 2;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="book-scene">

    <div class="book">

      <section class="page left-page"></section>

      <section class="page right-page"></section>

      <div class="book-spine"></div>

    </div>

  </main>

</body>
</html>
