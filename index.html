
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Promise and a Wish</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #241810;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 20px;
    }

    .book-scene {
      width: min(1100px, 100%);
      aspect-ratio: 3 / 2;
      perspective: 2000px;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      transform-style: preserve-3d;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
    }

    .page {
      width: 50%;
      height: 100%;
      background-image: url('sunset-book.png');
      background-size: 200% 100%;
      background-repeat: no-repeat;
    }

    .left-page {
      background-position: left center;
      border-radius: 5px 0 0 5px;
    }

    .right-page {
      background-position: right center;
      border-radius: 0 5px 5px 0;
    }

    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 3px;
      height: 100%;
      transform: translateX(-50%);
      background: rgba(50, 25, 12, 0.4);
      z-index: 20;
    }

    /* MULTIPLE FLIPPING PAGES */

    .flip-page {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 1.2s ease-in-out;
    }

    .flip-page.flipped {
      transform: rotateY(-180deg);
      box-shadow: -8px 0 18px rgba(0, 0, 0, 0.2);
    }

    .page-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background-image: url('sunset-book.png');
      background-size: 200% 100%;
      background-repeat: no-repeat;
    }

    .page-front {
      background-position: right center;
      border-radius: 0 5px 5px 0;
    }

    .page-back {
      background-position: left center;
      transform: rotateY(180deg);
      border-radius: 5px 0 0 5px;
    }

    /* BUTTONS */

    .controls {
      display: flex;
      gap: 15px;
    }

    button {
      background: #d6b58a;
      color: #29180f;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #edcfaa;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      button {
        padding: 10px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="book-scene">

    <div class="book">

      <div class="page left-page"></div>
      <div class="page right-page"></div>

      <!-- PAGE 1 -->
      <div class="flip-page">
        <div class="page-face page-front"></div>
        <div class="page-face page-back"></div>
      </div>

      <!-- PAGE 2 -->
      <div class="flip-page">
        <div class="page-face page-front"></div>
        <div class="page-face page-back"></div>
      </div>

      <!-- PAGE 3 -->
      <div class="flip-page">
        <div class="page-face page-front"></div>
        <div class="page-face page-back"></div>
      </div>

      <!-- PAGE 4 -->
      <div class="flip-page">
        <div class="page-face page-front"></div>
        <div class="page-face page-back"></div>
      </div>

      <!-- PAGE 5 -->
      <div class="flip-page">
        <div class="page-face page-front"></div>
        <div class="page-face page-back"></div>
      </div>

      <!-- PAGE 6 -->
      <div class="flip-page">
        <div class="page-face page-front"></div>
        <div class="page-face page-back"></div>
      </div>

      <div class="book-spine"></div>

    </div>

  </main>

  <div class="controls">

    <button id="nextButton" onclick="turnPage()">
      Turn Page
    </button>

    <button id="backButton" onclick="resetPage()">
      Turn Back
    </button>

  </div>

  <script>

    const pages = document.querySelectorAll('.flip-page');

    let currentPage = 0;
    let isTurning = false;

    // Arrange the pages in a stack

    pages.forEach((page, index) => {
      page.dataset.index = index;
      page.style.zIndex = pages.length - index + 10;
    });

    function updateButtons() {
      document.getElementById('nextButton').disabled =
        currentPage >= pages.length;

      document.getElementById('backButton').disabled =
        currentPage <= 0;
    }

    function turnPage() {

      if (isTurning || currentPage >= pages.length) return;

      isTurning = true;

      const page = pages[currentPage];
      const index = Number(page.dataset.index);

      page.style.zIndex = pages.length + 20;

      page.classList.add('flipped');

      currentPage++;

      page.addEventListener('transitionend', function(event) {

        if (event.propertyName !== 'transform') return;

        page.style.zIndex = index + 1;

        isTurning = false;
        updateButtons();

      }, { once: true });

      updateButtons();
    }

    function resetPage() {

      if (isTurning || currentPage <= 0) return;

      isTurning = true;

      currentPage--;

      const page = pages[currentPage];
      const index = Number(page.dataset.index);

      page.style.zIndex = pages.length + 20;

      page.classList.remove('flipped');

      page.addEventListener('transitionend', function(event) {

        if (event.propertyName !== 'transform') return;

        page.style.zIndex = pages.length - index + 10;

        isTurning = false;
        updateButtons();

      }, { once: true });

      updateButtons();
    }

    updateButtons();

  </script>

</body>
</html>
