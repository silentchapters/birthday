
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Promise and a Wish</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #241810;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 20px;
    }

    .book-scene {
      width: min(1100px, 100%);
      aspect-ratio: 3 / 2;
      perspective: 2000px;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      transform-style: preserve-3d;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
    }

    .page {
      width: 50%;
      height: 100%;
      background-image: url('sunset-book.png');
      background-size: 200% 100%;
      background-repeat: no-repeat;
    }

    .left-page {
      background-position: left center;
      border-radius: 5px 0 0 5px;
    }

    .right-page {
      background-position: right center;
      border-radius: 0 5px 5px 0;
    }

    .book-spine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 3px;
      height: 100%;
      transform: translateX(-50%);
      background: rgba(50, 25, 12, 0.4);
      z-index: 3;
    }

    .flip-page {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 1.2s ease-in-out;
      z-index: 4;
    }

    .flip-page.flipped {
      transform: rotateY(-180deg);
    }

    .page-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background-image: url('sunset-book.png');
      background-size: 200% 100%;
      background-repeat: no-repeat;
    }

    .page-front {
      background-position: right center;
      border-radius: 0 5px 5px 0;
    }

    .page-back {
      background-position: left center;
      transform: rotateY(180deg);
      border-radius: 5px 0 0 5px;
    }

    .flip-page.flipped {
      box-shadow: -8px 0 18px rgba(0, 0, 0, 0.2);
    }

    .controls {
      display: flex;
      gap: 15px;
    }

    button {
      background: #d6b58a;
      color: #29180f;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #edcfaa;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      button {
        padding: 10px 18px;
      }
    }
  </style>
</head>

<body>

  <main class="book-scene">

    <div class="book">

      <div class="page left-page"></div>
      <div class="page right-page"></div>

      <div class="flip-page" id="flipPage">

        <div class="page-face page-front"></div>
        <div class="page-face page-back"></div>

      </div>

      <div class="book-spine"></div>

    </div>

  </main>

  <div class="controls">

    <button onclick="turnPage()">
      Turn Page
    </button>

    <button onclick="resetPage()">
      Turn Back
    </button>

  </div>

  <script>
    function turnPage() {
      document.getElementById('flipPage').classList.add('flipped');
    }

    function resetPage() {
      document.getElementById('flipPage').classList.remove('flipped');
    }
  </script>

</body>
</html>
